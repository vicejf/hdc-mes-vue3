# 生产环境Docker Compose配置 - 不在容器中构建版本
# 注意：使用前请确保已经在外部完成构建
# 构建命令：pnpm install && pnpm run build:antd

services:
  # 前端应用
  hdc-mes-vue3:
    build: .
    container_name: hdc-mes-vue3
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    # 挂载本地构建产物（可选，便于开发调试）
    volumes:
      - ./apps/web-antd/dist:/usr/share/nginx/html:ro

  # 可选：Nginx反向代理（如果需要的话）
  nginx-proxy:
    image: nginx:alpine
    container_name: mes-nginx-proxy
    restart: unless-stopped
    ports:
      - "5666:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - hdc-mes-vue3
